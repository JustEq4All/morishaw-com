backend:
  name: git-gateway
  branch: master

media_folder: "public/images/uploads"
public_folder: "/images/uploads"


# Netlify Identity
site_url: https://morishaw.com

collections:

  # ── EVENTS ────────────────────────────────────────────────────────────────
  - name: "events"
    label: "Events"
    label_singular: "Event"
    folder: "src/content/events"
    extension: "json"
    format: "json"
    create: true
    slug: "{{year}}-{{slug}}"
    summary: "{{title}} — {{date}} ({{location}})"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "string", hint: "e.g. 2026-03 or 2026-09-15" }
      - { label: "Location", name: "location", widget: "string" }
      - label: "Role"
        name: "role"
        widget: "select"
        options: ["Speaker", "Moderator", "Organizer", "Facilitator", "Panelist", "Participant"]
      - { label: "Event URL", name: "url", widget: "string", required: false }
      - { label: "Recap / notes", name: "recap", widget: "text", required: false }
      - { label: "Feature on homepage?", name: "featured", widget: "boolean", default: false }

  # ── WRITINGS ───────────────────────────────────────────────────────────────
  - name: "writings"
    label: "Writings & Press"
    label_singular: "Writing"
    folder: "src/content/writings"
    extension: "json"
    format: "json"
    create: true
    slug: "{{outlet}}-{{year}}-{{slug}}"
    summary: "{{title}} — {{outlet}} ({{year}})"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Outlet / Publication", name: "outlet", widget: "string" }
      - { label: "Year", name: "year", widget: "number", value_type: "int" }
      - { label: "URL", name: "url", widget: "string" }
      - { label: "Summary (1–2 sentences)", name: "summary", widget: "text", required: false }
      - label: "Format"
        name: "format"
        widget: "select"
        options: ["Op-ed", "Essay", "Report", "Policy", "Interview"]
      - { label: "Feature on homepage?", name: "featured", widget: "boolean", default: false }

  # ── TALKS ─────────────────────────────────────────────────────────────────
  - name: "talks"
    label: "Signature Talks"
    label_singular: "Talk"
    folder: "src/content/talks"
    extension: "json"
    format: "json"
    create: true
    slug: "{{slug}}"
    summary: "{{order}}. {{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - label: "Formats available"
        name: "formats"
        widget: "select"
        multiple: true
        options: ["Keynote", "Panel", "Moderation", "Workshop", "Faculty", "Ceremony"]
      - { label: "Display order (1 = first)", name: "order", widget: "number", default: 99 }

  # ── TESTIMONIALS ──────────────────────────────────────────────────────────
  - name: "testimonials"
    label: "Testimonials"
    label_singular: "Testimonial"
    folder: "src/content/testimonials"
    extension: "json"
    format: "json"
    create: true
    slug: "{{name}}"
    summary: "{{name}} — {{organisation}}"
    fields:
      - { label: "Quote (no quotes needed)", name: "quote", widget: "text" }
      - { label: "Person's name", name: "name", widget: "string" }
      - { label: "Role / title", name: "role", widget: "string" }
      - { label: "Organisation", name: "organisation", widget: "string" }
      - label: "Context"
        name: "type"
        widget: "select"
        options: ["speaking", "consulting", "general"]

  # ── SITE CONTENT (bio, home text, contact info) ────────────────────────────
  - name: "site"
    label: "Site Content"
    files:

      - label: "Homepage"
        name: "home"
        file: "src/content/site/home.json"
        fields:
          - { label: "Hero headline (line 1)", name: "hero_line1", widget: "string" }
          - { label: "Hero headline (line 2 — italic)", name: "hero_line2", widget: "string" }
          - { label: "Hero subline", name: "hero_sub", widget: "text" }
          - { label: "Positioning tagline (footer)", name: "tagline", widget: "string" }

      - label: "About / Bio"
        name: "about"
        file: "src/content/site/about.json"
        fields:
          - { label: "Short bio (2–3 sentences)", name: "short_bio", widget: "text" }
          - { label: "Origin story paragraph", name: "origin", widget: "text" }
          - { label: "The thread paragraph", name: "thread", widget: "text" }
          - { label: "Current photo", name: "photo", widget: "image", required: false }

      - label: "Contact Info"
        name: "contact"
        file: "src/content/site/contact.json"
        fields:
          - { label: "Primary email", name: "email", widget: "string" }
          - { label: "Studio Stoofpot email", name: "email_studio", widget: "string" }
          - { label: "CRF Foundation email", name: "email_crf", widget: "string" }
          - { label: "Calendly / booking link", name: "calendly_url", widget: "string", required: false }
          - { label: "Instagram handle", name: "instagram", widget: "string" }
          - { label: "LinkedIn URL", name: "linkedin", widget: "string" }
          - { label: "Speakers Academy URL", name: "speakers_academy", widget: "string" }
